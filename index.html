<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>我的网站</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 50px;
    }

    #myImage {
      display: none; /* 默认隐藏图片 */
      margin-top: 20px;
      max-width: 80%;
      border-radius: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <h1>欢迎来到我的网站</h1>

  <!-- 按钮 -->
  <button onclick="showImage()">点击显示图片</button>

  <!-- 图片（替换成你的图片文件名） -->
  <br>
  <img id="myImage" src="DOUYIN_LP_1778344490015.jpg" alt="我的图片">

  <script>
    function showImage() {
      document.getElementById("myImage").style.display = "block";
    }
  </script>

</body>
</html>
